<!doctype html>
<html><head><meta charset="utf-8"><title>Animal asset preview</title>
<style>
body{margin:0;background:#2f7a3d;font:12px system-ui;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{background:#3e8948;border-radius:8px;padding:6px;text-align:center}
.cell img{height:64px;display:block;margin:0 auto}
.pair{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:70px}
.lbl{color:#fff;font-weight:bold;margin-top:3px}
.src{color:#d3edda;font-size:9px}
</style></head>
<body>
<script>
fetch('../assets/animals/manifest.json').then(r=>r.json()).then(m=>{
  document.body.innerHTML = Array.from({length:40},(_,i)=>{
    const q='q'+String(i+1).padStart(3,'0');
    const src='../assets/animals/'+q+'.svg';
    return '<div class="cell"><div class="pair">' +
      '<img src="'+src+'" style="filter:brightness(0) drop-shadow(0 0 2px #cfefff)" alt="">' +
      '<img src="'+src+'" alt="">' +
      '</div><div class="lbl">'+q+'</div><div class="src">'+(m[q]?m[q].source.split(':')[0]:'')+'</div></div>';
  }).join('');
});
</script>
</body></html>
